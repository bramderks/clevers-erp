name: Clevers quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installeer dependencies
        run: npm ci

      - name: Valideer Prisma schema
        run: npm run prisma:validate

      - name: Genereer Prisma Client
        run: npm run prisma:generate

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint -- --max-warnings 0

      - name: Beperk installatie tot productie
        run: npm prune --omit=dev

      - name: Audit geïnstalleerde productie dependencies
        run: npm audit --no-package-lock --audit-level=high
