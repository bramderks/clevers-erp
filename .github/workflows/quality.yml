name: Clevers quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installeer dependencies
        run: npm ci

      - name: Tijdelijke ESLint autofix
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx eslint . --fix

      - name: Herstel quality workflow en commit autofixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git checkout HEAD^ -- .github/workflows/quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Geen ESLint autofixes nodig."
            exit 0
          fi
          git commit -m "fix: apply eslint autofixes"
          git push

      - name: Valideer Prisma schema
        run: npm run prisma:validate

      - name: Genereer Prisma Client
        run: npm run prisma:generate

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Beperk installatie tot productie
        run: npm prune --omit=dev

      - name: Audit geïnstalleerde productie dependencies
        run: npm audit --no-package-lock --audit-level=high
