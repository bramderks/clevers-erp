name: Clevers quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installeer dependencies
        run: npm ci

      - name: Valideer Prisma schema
        run: npm run prisma:validate

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint
