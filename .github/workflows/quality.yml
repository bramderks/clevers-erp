name: Clevers quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Tijdelijk houdt CI de lockfile gelijk aan de bijgewerkte beveiligingsversies.
      - name: Synchroniseer lockfile
        run: npm install --package-lock-only

      - name: Commit bijgewerkte lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Update dependency lockfile"
            git push
          fi

      - name: Installeer dependencies
        run: npm ci

      - name: Valideer Prisma schema
        run: npm run prisma:validate

      - name: Genereer Prisma Client
        run: npm run prisma:generate

      - name: Tests
        run: npm test

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint:ci

      - name: Audit alle dependencies
        run: node scripts/audit-dependencies.cjs

      - name: Beperk installatie tot productie
        run: npm prune --omit=dev

      - name: Audit productie dependencies
        run: npm audit --audit-level=high --omit=dev
