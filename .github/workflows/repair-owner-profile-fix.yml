name: Repair owner profile authorization patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair ordering and remove temporary workflows
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('app/(dashboard)/medewerkers/[id]/page.tsx')
          text = page.read_text()

          old = '''  const toegestaneOrganisatieIds = Array.from(\n    new Set([\n      ...medewerkerOrganisatieIds,\n      ...uitnodigingOrganisatieIds,\n      ...eigenaarOrganisatieIdsVoorZelf,\n    ]),\n  );\n\n  const isEigenaar =\n    toegestaneOrganisatieIds.length > 0 &&\n    toegestaneOrganisatieIds.some((organisatieId) =>\n      actieveRelaties.some(\n        (relatie) =>\n          relatie.organisatieId === organisatieId &&\n          relatie.rol.naam.trim().toLowerCase() === "eigenaar",\n      ),\n    );\n\n  const isEigenProfiel = gebruiker.medewerker?.id === id;\n\n  // Een eigenaar is organisatiebreed bevoegd. Ook wanneer het eigen\n  // medewerkerprofiel nog geen vestiging heeft, moet de eigenaar het\n  // profiel kunnen openen en de eerste vestiging/planningstags kunnen instellen.\n  const eigenaarOrganisatieIdsVoorZelf = isEigenProfiel\n    ? actieveRelaties\n        .filter(\n          (relatie) =>\n            relatie.rol.naam.trim().toLowerCase() === "eigenaar",\n        )\n        .map((relatie) => relatie.organisatieId)\n    : [];'''
          new = '''  const isEigenProfiel = gebruiker.medewerker?.id === id;\n\n  // Een eigenaar is organisatiebreed bevoegd. Ook wanneer het eigen\n  // medewerkerprofiel nog geen vestiging heeft, moet de eigenaar het\n  // profiel kunnen openen en de eerste vestiging/planningstags kunnen instellen.\n  const eigenaarOrganisatieIdsVoorZelf = isEigenProfiel\n    ? actieveRelaties\n        .filter(\n          (relatie) =>\n            relatie.rol.naam.trim().toLowerCase() === "eigenaar",\n        )\n        .map((relatie) => relatie.organisatieId)\n    : [];\n\n  const toegestaneOrganisatieIds = Array.from(\n    new Set([\n      ...medewerkerOrganisatieIds,\n      ...uitnodigingOrganisatieIds,\n      ...eigenaarOrganisatieIdsVoorZelf,\n    ]),\n  );\n\n  const isEigenaar =\n    toegestaneOrganisatieIds.length > 0 &&\n    toegestaneOrganisatieIds.some((organisatieId) =>\n      actieveRelaties.some(\n        (relatie) =>\n          relatie.organisatieId === organisatieId &&\n          relatie.rol.naam.trim().toLowerCase() === "eigenaar",\n      ),\n    );'''
          if old not in text:
              raise SystemExit('expected ordering block not found')
          page.write_text(text.replace(old, new, 1))

          for workflow in [
              Path('.github/workflows/fix-owner-profile-edit.yml'),
              Path('.github/workflows/repair-owner-profile-fix.yml'),
          ]:
              if workflow.exists():
                  workflow.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "app/(dashboard)/medewerkers/[id]/page.tsx" .github/workflows
          git commit -m "fix: repair owner self profile authorization"
          git push
