name: Apply staged planning board change

on:
  push:
    branches:
      - feature/planning-board-start-view

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/planning-board-start-view
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply implementation and remove staging files
        run: |
          git apply scripts/patches/planning-board-start-view.patch
          rm scripts/patches/planning-board-start-view.patch
          rm .github/workflows/apply-planning-board-change.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement personal planning board start preference"
          git push origin HEAD:feature/planning-board-start-view
