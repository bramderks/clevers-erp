name: Patch owner employee workflow

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: apply owner employee workflow patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch owner permissions and role assignment
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}')
              p.write_text(text.replace(old, new, 1))

          page = 'app/(dashboard)/medewerkers/[id]/page.tsx'
          replace(page,
              '''  const medewerkerOrganisatieIds =\n    Array.from(\n      new Set(\n        medewerker.vestigingen.map(\n          (relatie) =>\n            relatie.vestiging.organisatieId,\n        ),\n      ),\n    );\n\n  const isEigenaar =\n    medewerkerOrganisatieIds.length > 0 &&\n    medewerkerOrganisatieIds.every(\n      (organisatieId) =>\n        actieveRelaties.some(\n          (relatie) =>\n            relatie.organisatieId === organisatieId &&\n            relatie.rol.naam\n              .trim()\n              .toLowerCase() ===\n              "eigenaar",\n        ),\n    );''',
              '''  const medewerkerOrganisatieIds =\n    Array.from(\n      new Set(\n        medewerker.vestigingen.map(\n          (relatie) =>\n            relatie.vestiging.organisatieId,\n        ),\n      ),\n    );\n\n  // Een geactiveerde nieuwe medewerker kan nog geen vestiging hebben.\n  // De uitnodiging bepaalt in die fase tot welke organisatie het dossier behoort.\n  const uitnodigingOrganisatieIds =\n    medewerker.email\n      ? (\n          await prisma.medewerkerUitnodiging.findMany({\n            where: {\n              email: medewerker.email.trim().toLowerCase(),\n              gebruiktOp: { not: null },\n            },\n            select: {\n              organisatieId: true,\n            },\n          })\n        ).map((uitnodiging) => uitnodiging.organisatieId)\n      : [];\n\n  const toegestaneOrganisatieIds =\n    Array.from(\n      new Set([\n        ...medewerkerOrganisatieIds,\n        ...uitnodigingOrganisatieIds,\n      ]),\n    );\n\n  const isEigenaar =\n    toegestaneOrganisatieIds.length > 0 &&\n    toegestaneOrganisatieIds.some(\n      (organisatieId) =>\n        actieveRelaties.some(\n          (relatie) =>\n            relatie.organisatieId === organisatieId &&\n            relatie.rol.naam\n              .trim()\n              .toLowerCase() ===\n              "eigenaar",\n        ),\n    );''')

          route = 'app/api/medewerkers/[id]/route.ts'
          replace(route,
              '''            id: true,\n\n            vestigingen: {''',
              '''            id: true,\n\n            email: true,\n\n            vestigingen: {''')
          replace(route,
              '''    if (\n      organisatieIds.length === 0\n    ) {\n      return NextResponse.json(\n        {\n          error:\n            "Deze medewerker is niet aan een actieve organisatie gekoppeld.",\n        },\n        {\n          status: 400,\n        },\n      );\n    }''',
              '''    const uitnodigingOrganisatieIds =\n      medewerker.email\n        ? (\n            await prisma.medewerkerUitnodiging.findMany({\n              where: {\n                email: medewerker.email.trim().toLowerCase(),\n                gebruiktOp: { not: null },\n              },\n              select: {\n                organisatieId: true,\n              },\n            })\n          ).map((uitnodiging) => uitnodiging.organisatieId)\n        : [];\n\n    const toegestaneOrganisatieIds =\n      Array.from(\n        new Set([\n          ...organisatieIds,\n          ...uitnodigingOrganisatieIds,\n        ]),\n      );\n\n    if (\n      toegestaneOrganisatieIds.length === 0\n    ) {\n      return NextResponse.json(\n        {\n          error:\n            "Deze medewerker is niet aan een actieve organisatie gekoppeld.",\n        },\n        {\n          status: 400,\n        },\n      );\n    }''')
          replace(route,
              '''    const isEigenaar =\n      organisatieIds.length > 0 &&\n      organisatieIds.every(\n        (organisatieId) =>''',
              '''    const isEigenaar =\n      toegestaneOrganisatieIds.length > 0 &&\n      toegestaneOrganisatieIds.some(\n        (organisatieId) =>''')
          replace(route,
              '''              organisatieId: {\n                in: organisatieIds,\n              },''',
              '''              organisatieId: {\n                in: toegestaneOrganisatieIds,\n              },''')

          replace(route,
              '''      const resultaat =\n        await medewerkerService.update(\n          id,\n          updateData,\n        );\n\n      return NextResponse.json({''',
              '''      const resultaat =\n        await medewerkerService.update(\n          id,\n          updateData,\n        );\n\n      if (data.rolIds !== undefined) {\n        const rolIds = controleerStringArray(\n          data.rolIds,\n          "Rollen",\n        );\n        await medewerkerService.setRollen(id, rolIds);\n      }\n\n      if (data.tagIds !== undefined) {\n        const tagIds = controleerStringArray(\n          data.tagIds,\n          "Tags",\n        );\n        await medewerkerService.setTags(id, tagIds);\n      }\n\n      return NextResponse.json({''')

          Path('.github/workflows/fix-owner-role.yml').unlink()

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply owner employee workflow patch"
          git push