name: Refresh dependency lockfile
on:
  push:
    branches: [feature/ziekmelding-reservediensten]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- package-lock.json; then
            git add package-lock.json
            git commit -m "Refresh lockfile for patched dependencies"
            git push origin HEAD:feature/ziekmelding-reservediensten
          fi
