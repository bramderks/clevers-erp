name: Temporary dependency lock sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lock and remove temporary workflow
        run: |
          rm .github/workflows/sync-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/sync-lock.yml
          git commit -m "fix: synchronize dependency lock"
          git push
